<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penwash</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{
  --sans:"Satoshi",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --bg:#f3efe5; --surface:#fffdf7; --sunken:#ebe6d9;
  --ink:#16150f; --muted:#4f4b40; --line:#d9d3c2; --line-strong:#b9b29d;
  --accent:#1a5640; --accent-ink:#ffffff; --accent-soft:#dbeadf;
  --good:#17613f; --bad:#97440a; --focus:#1a5640;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121210; --surface:#1a1915; --sunken:#24231e;
  --ink:#f3f0e6; --muted:#b9b5a8; --line:#32302a; --line-strong:#4d4a3f;
  --accent:#86d0ae; --accent-ink:#0b1a13; --accent-soft:#1d2e25;
  --good:#86d0ae; --bad:#e8a971; --focus:#86d0ae;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea,input{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

.app{height:100dvh;display:grid;grid-template-rows:auto 1fr;max-width:1500px;margin:0 auto;padding:0 20px 18px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px}
.brand{display:flex;align-items:baseline;gap:14px}
.mark{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tag{color:var(--muted);font-size:14px;font-weight:500}
.bar-right{display:flex;align-items:center;gap:14px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}
.ghost{background:none;border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:7px;align-items:center}
.ghost:hover{color:var(--ink);border-color:var(--ink)}

/* layout */
.shell{min-height:0;display:grid;grid-template-columns:318px 1fr;gap:16px}
.side{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.side-scroll{flex:1;min-height:0;overflow:auto;padding-right:2px}
.side h2{margin:0 0 12px;font-size:17px;font-weight:900;letter-spacing:-.01em}
.field{margin-bottom:15px}
.lab{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px}
.lab .val{color:var(--accent);font-weight:900}
.seg{display:grid;gap:3px;background:var(--sunken);border-radius:10px;padding:3px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.four{grid-template-columns:1fr 1fr}
.seg.four button:last-child:nth-child(odd){grid-column:1/-1}
.seg button{border:0;background:none;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
.desc{margin:7px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0;display:block}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:500}
details.adv{border-top:1px solid var(--line);padding-top:12px}
details.adv summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.adv summary::after{content:"+";font-weight:900}
details.adv[open] summary::after{content:"–"}
details.adv[open] summary{color:var(--ink);margin-bottom:12px}
.adv textarea{width:100%;height:84px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px;resize:none;line-height:1.45}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700;margin-top:4px}
.check input{accent-color:var(--accent);width:15px;height:15px}
.rw.off{display:none}
.cta{margin-top:12px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);padding:12px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}
.cta:hover{filter:brightness(1.1)}
.cta:disabled{opacity:.6;cursor:progress}
.kbd{margin:8px 0 0;text-align:center;font-size:12px;color:var(--muted);font-weight:500}

/* work area */
.work{min-height:0;display:grid;grid-template-rows:1fr auto;gap:12px}
.editors{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.pane-h{padding:13px 18px 0;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pane textarea,.output{flex:1;min-height:0;border:0;background:transparent;resize:none;padding:10px 18px;font-family:var(--serif);font-weight:500;font-size:18.5px;line-height:1.65;color:var(--ink);outline:none;white-space:pre-wrap;overflow:auto}
.pane textarea::placeholder{color:var(--muted);opacity:.85}
.output:empty::before{content:"The result will appear here.";color:var(--muted);font-style:italic}
.pane-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px 10px 18px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}

/* results strip */
.strip{display:none;align-items:center;gap:10px 22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 18px}
.strip.on{display:flex}
.stat{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.stat .n{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .d{font-size:12px;font-weight:900}
.d.up{color:var(--good)} .d.down{color:var(--bad)}
.strip .btn{margin-left:auto}

dialog{border:1px solid var(--line-strong);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(460px,92vw);max-height:80vh}
dialog::backdrop{background:#0008}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:900}
.dlg-b{padding:14px 18px 18px;overflow:auto;max-height:60vh}
.changes{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px}
.changes li{display:flex;gap:12px;align-items:baseline}
.changes .c{font-weight:900;min-width:26px;color:var(--accent)}
.changes small{color:var(--muted);font-size:12.5px;font-weight:500}
.note{color:var(--muted);font-weight:500;margin:0}

@media(max-width:900px){
  body{overflow:auto}
  .app{height:auto;padding:0 14px 20px}
  .shell,.editors{grid-template-columns:1fr}
  .tag{display:none}
  .pane{min-height:300px}
  .strip{flex-wrap:wrap;gap:12px 22px}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark">penwash</span><span class="tag">Natural writing, on your Mac. Nothing is uploaded.</span></div>
    <div class="bar-right">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking model…</span></div>
      <button class="ghost" id="theme" aria-label="Toggle light and dark theme">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M7 1.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
        <span id="themeLabel">Theme</span>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="side">
      <div class="side-scroll">
        <h2>Options</h2>

        <div class="field">
          <div class="lab">Mode</div>
          <div class="seg two" id="mode" role="group" aria-label="Mode">
            <button aria-pressed="true" data-v="rewrite">Rewrite</button>
            <button aria-pressed="false" data-v="clean">Clean up only</button>
          </div>
          <p class="desc" id="modeDesc">A local model rewrites it in plainer, more natural words.</p>
        </div>

        <div class="rw">
          <div class="field">
            <div class="lab">Tone</div>
            <div class="seg four" id="tone" role="group" aria-label="Tone">
              <button aria-pressed="true" data-v="natural">Natural</button>
              <button aria-pressed="false" data-v="casual">Casual</button>
              <button aria-pressed="false" data-v="professional">Professional</button>
              <button aria-pressed="false" data-v="academic">Academic</button>
              <button aria-pressed="false" data-v="fiction">Fiction</button>
            </div>
          </div>

          <div class="field">
            <label class="lab" for="strength"><span>Strength</span><span class="val" id="sv">60%</span></label>
            <input type="range" id="strength" min="0" max="100" value="60">
            <div class="ends"><span>Light edits</span><span>Full rewrite</span></div>
          </div>

          <div class="field">
            <label class="lab" for="model">Model</label>
            <select id="model"></select>
          </div>

          <details class="adv">
            <summary>Advanced</summary>
            <div class="field">
              <div class="lab">Your writing sample</div>
              <textarea id="voice" placeholder="Paste a paragraph you wrote (optional)"></textarea>
            </div>
            <div class="field">
              <label class="lab" for="passes"><span>Retry passes</span><span class="val" id="pv">2</span></label>
              <input type="range" id="passes" min="1" max="4" value="2">
            </div>
            <label class="check"><input type="checkbox" id="dashes"> Keep em dashes</label>
          </details>
        </div>
      </div>
      <button class="cta" id="go">Rewrite text</button>
      <p class="kbd">or press Cmd + Enter</p>
    </aside>

    <main class="work">
      <div class="editors">
        <section class="pane">
          <div class="pane-h">Original</div>
          <textarea id="input" placeholder="Paste or type your text here." spellcheck="true"></textarea>
          <div class="pane-f"><span id="inCount">0 words</span><button class="btn" id="clear">Clear</button></div>
        </section>
        <section class="pane">
          <div class="pane-h">Result</div>
          <div class="output" id="output" aria-live="polite"></div>
          <div class="pane-f"><span id="outCount">0 words</span><button class="btn" id="copy">Copy</button></div>
        </section>
      </div>
      <div class="strip" id="strip">
        <div id="stats" style="display:contents"></div>
        <button class="btn" id="detailsBtn">Details</button>
      </div>
    </main>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-h"><span id="dlgTitle">What changed</span><button class="btn" id="dlgClose">Close</button></div>
  <div class="dlg-b"><ul class="changes" id="changes"></ul></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const state={mode:"rewrite",tone:"natural"};
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const root=document.documentElement;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DESC={rewrite:"A local model rewrites it in plainer, more natural words.",
  clean:"Keeps your exact wording. Removes em dashes, emoji, markdown symbols and stock words."};

function setTheme(t){root.dataset.theme=t;$("#themeLabel").textContent=t==="dark"?"Dark":"Light";try{localStorage.setItem("theme",t)}catch{}}
let saved=null;try{saved=localStorage.getItem("theme")}catch{}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#theme").onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");

function bindSeg(id,cb){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b));cb(b.dataset.v)});
}
bindSeg("tone",v=>state.tone=v);
bindSeg("mode",v=>{
  state.mode=v; $("#modeDesc").textContent=DESC[v];
  document.querySelectorAll(".rw").forEach(e=>e.classList.toggle("off",v==="clean"));
  $("#go").textContent=v==="clean"?"Clean up text":"Rewrite text";
});
$("#strength").oninput=e=>$("#sv").textContent=e.target.value+"%";
$("#passes").oninput=e=>$("#pv").textContent=e.target.value;
$("#input").oninput=e=>$("#inCount").textContent=words(e.target.value)+" words";
$("#clear").onclick=()=>{$("#input").value="";$("#output").textContent="";$("#strip").classList.remove("on");$("#inCount").textContent="0 words";$("#outCount").textContent="0 words"};
$("#copy").onclick=async()=>{await navigator.clipboard.writeText($("#output").innerText);$("#copy").textContent="Copied";setTimeout(()=>$("#copy").textContent="Copy",1200)};
$("#detailsBtn").onclick=()=>$("#dlg").showModal();
$("#dlgClose").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")$("#go").click()});

async function init(){
  try{
    const r=await (await fetch("/api/models")).json();
    $("#dot").className="dot "+(r.ok?"ok":"bad");
    $("#statusText").textContent=r.ok?"Model ready":"Ollama not running";
    $("#model").innerHTML=(r.models.length?r.models:["qwen2.5:14b"]).map(m=>`<option>${esc(m)}</option>`).join("");
  }catch{$("#dot").className="dot bad";$("#statusText").textContent="Server error"}
}
init();

function stat(label,a,b,goodUp){
  const d=+(a-b).toFixed(2), cls=(d===0||goodUp===null)?"":((d>0)===goodUp?"up":"down");
  return `<div class="stat"><span class="n">${a}</span><span class="l">${label}</span><span class="d ${cls}">${d===0?"":(d>0?"+":"")+d}</span></div>`;
}
function showStats(b,a){
  $("#stats").innerHTML=stat("words",a.words,b.words,null)+stat("avg. sentence",a.avg_sentence,b.avg_sentence,false)+
    stat("rhythm",a.burstiness,b.burstiness,true)+stat("stock phrases",a.stock_phrases,b.stock_phrases,false);
  $("#strip").classList.add("on");
}

async function runClean(text){
  const r=await (await fetch("/api/clean",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})})).json();
  $("#output").textContent=r.text; $("#outCount").textContent=words(r.text)+" words";
  showStats(r.before,r.after);
  $("#dlgTitle").textContent="What changed";
  $("#changes").innerHTML=r.changes.length
    ? r.changes.map(c=>`<li><span class="c">${c.count}</span><span>${esc(c.label)}<br><small>${c.examples.map(esc).join(" · ")}</small></span></li>`).join("")
    : `<li class="note">Nothing to change. This text already reads clean.</li>`;
}

async function runRewrite(text){
  const out=$("#output"); out.textContent="";
  const done=[]; let cur="";
  const render=()=>{out.textContent=[...done,cur].filter(Boolean).join("\n\n");out.scrollTop=out.scrollHeight;$("#outCount").textContent=words(out.textContent)+" words"};
  const res=await fetch("/api/rewrite",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    text,model:$("#model").value,tone:state.tone,strength:+$("#strength").value,passes:+$("#passes").value,
    voice_sample:$("#voice").value,keep_dashes:$("#dashes").checked})});
  const reader=res.body.getReader(),dec=new TextDecoder();let buf="";
  while(true){
    const {value,done:fin}=await reader.read(); if(fin) break;
    buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i); buf=buf.slice(i+1); if(!line) continue;
      const e=JSON.parse(line);
      if(e.type==="start") cur="";
      else if(e.type==="token"){cur+=e.text;render()}
      else if(e.type==="para_done"){done[e.para]=e.text;cur="";render()}
      else if(e.type==="error") out.textContent=e.message;
      else if(e.type==="done"){
        showStats(e.before,e.after);
        $("#dlgTitle").textContent="Checks";
        $("#changes").innerHTML=e.warnings.length
          ? e.warnings.map(w=>`<li class="note">${esc(w)}</li>`).join("")
          : `<li class="note">Numbers and facts from the original are all still present.</li>`;
      }
    }
  }
}

$("#go").onclick=async()=>{
  const text=$("#input").value.trim(); if(!text) return;
  const btn=$("#go"),label=btn.textContent; btn.disabled=true; btn.textContent="Working…";
  try{ state.mode==="clean" ? await runClean(text) : await runRewrite(text) }
  catch(err){ $("#output").textContent="Something went wrong: "+err.message }
  btn.disabled=false; btn.textContent=label;
};
</script>
</body>
</html>
